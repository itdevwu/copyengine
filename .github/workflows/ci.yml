name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TORCH_CPU_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  # Core, C ABI and the numpy path: no torch.
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: taiki-e/install-action@just
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: pip install scikit-build-core nanobind pytest
      - run: CE_WERROR=ON just test

  # The CUDA backend and kernels against the newest CUDA 13 headers and nvcc
  # (entry points change shape across majors). Compiles only: CI has no GPU.
  cuda13:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: CUDA 13 headers and nvcc from NVIDIA's wheels
        run: |
          pip download -q --no-deps -d /tmp/cu13 'nvidia-cuda-runtime==13.*' 'nvidia-cuda-nvcc==13.*' \
            'nvidia-cuda-crt==13.*' 'nvidia-nvvm==13.*'
          for w in /tmp/cu13/*.whl; do python -m zipfile -e "$w" /tmp/cu13/x; done
          chmod -R +x /tmp/cu13/x/nvidia/cu13/bin /tmp/cu13/x/nvidia/cu13/nvvm/bin
      - name: Host sources and kernels compile
        run: |
          C=/tmp/cu13/x/nvidia/cu13
          cmake -S . -B build -G Ninja -DCE_CUDA_ARCHS=90 >/dev/null || true
          for f in src/backends/cuda/*.cpp src/core/frontend.cpp; do
            g++ -std=c++20 -fsyntax-only -Wall -Wextra -Werror -DCE_WITH_CUDA=1 -DCE_CUDA_KERNELS=1 \
              -Iinclude -Isrc -Ibuild/generated -isystem $C/include "$f"
          done
          $C/bin/nvcc -std=c++17 -O3 --fmad=false -Isrc -Iinclude -Ibuild/generated \
            -gencode arch=compute_90,code=sm_90 -gencode arch=compute_120,code=sm_120 \
            -fatbin src/backends/cuda/kernels.cu -o /tmp/kernels.fatbin

  # Per torch release: the stable-ABI ops and the interception shim built for
  # it, the whole suite with the shim and again with the Python mode (the same
  # semantics must hold), and the shim exported for the release wheel.
  torch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        torch: ["2.9.1", "2.10.0", "2.11.0", "2.12.1", "2.13.0"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@just
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: pip install scikit-build-core nanobind pytest numpy
      - run: pip install "torch==${{ matrix.torch }}" --index-url "$TORCH_CPU_INDEX"
      - run: just test
      - name: Same suite, Python interception mode
        run: CE_SHIM=0 pytest -q
      - name: Check both torch layers loaded
        working-directory: /tmp
        # The stable-ABI ops need torch >= 2.10; older torch uses the Python path for explicit copies.
        run: python -c "import torch, copyengine as ce; v = tuple(map(int, torch.__version__.split('+')[0].split('.')[:2])); assert (ce._torch_ops.copy_ is not None) == (v >= (2, 10)), ce._torch_ops.error; assert ce._shim.lib is not None, ce._shim.error"

  # Server ARM (Grace: GH200, GB200; GB10): the core and torch suites on an
  # aarch64 runner, with the oldest and newest torch.
  arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        torch: ["2.9.1", "2.13.0"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@just
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: pip install scikit-build-core nanobind pytest numpy
      - run: pip install "torch==${{ matrix.torch }}" --index-url "$TORCH_CPU_INDEX"
      - run: just test
      - name: Same suite, Python interception mode
        run: CE_SHIM=0 pytest -q

  # The stable ABI claim and the compile-on-import path: built with the newest
  # torch, run with the oldest supported one.
  cross-torch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: pip install scikit-build-core nanobind pytest numpy
      - run: pip install "torch==2.11.0" --index-url "$TORCH_CPU_INDEX"
      - run: pip wheel --no-build-isolation --no-deps . -w dist
      - run: pip install "torch==2.9.1" --index-url "$TORCH_CPU_INDEX"
      - run: pip install --no-deps dist/*.whl
      - name: On torch older than the ops' stable ABI, the ops stay off and the shim still loads
        working-directory: /tmp
        run: python -c "import copyengine as ce; assert ce._torch_ops.copy_ is None; assert ce._shim.lib is not None, ce._shim.error; print(ce._torch_ops.error); print(ce._shim.lib._name)"
      - run: pytest -q
      # And newer than the build: the ops (stable ABI) load as built; the shim compiles on import.
      - run: pip install "torch==2.13.0" --index-url "$TORCH_CPU_INDEX"
      - name: On torch newer than the build, the ops load and the shim compiles
        working-directory: /tmp
        run: python -c "import copyengine as ce; assert ce._torch_ops.copy_ is not None, ce._torch_ops.error; assert ce._shim.lib is not None, ce._shim.error; print(ce._shim.lib._name)"
      - run: pytest -q

  # Release wheels and sdist (docker/build-wheels.sh, which also runs locally):
  # manylinux_2_28 on x86_64 and aarch64, CUDA kernels for every GPU
  # architecture, a prebuilt shim per supported torch release. On a v* tag the
  # version must match CMakeLists.txt and the files are attached to the GitHub
  # release.
  wheel:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [core, torch, arm, cross-torch, cuda13]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            sdist: "1"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            sdist: "0"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    env:
      CE_WHEEL_SDIST: ${{ matrix.sdist }}
    steps:
      - uses: actions/checkout@v6
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want=$(sed -n 's/^project(copyengine VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          tag=${GITHUB_REF_NAME#v}
          suffix=${tag#"$want"}  # a pre-release: vX.Y.Z.devN or vX.Y.ZrcN
          [ "$tag" != "$suffix" ] || { echo "tag $GITHUB_REF_NAME, CMakeLists.txt $want"; exit 1; }
          [[ -z "$suffix" || "$suffix" =~ ^\.dev[0-9]+$|^rc[0-9]+$ ]] || { echo "bad pre-release tag $GITHUB_REF_NAME"; exit 1; }
          echo "CE_WHEEL_VERSION_SUFFIX=$suffix" >> "$GITHUB_ENV"
      - run: docker/build-wheels.sh
      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          [[ "$GITHUB_REF_NAME" =~ (dev|rc)[0-9]+$ ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $pre

  # PyPI trusted publishing (OIDC): the pypi.org project trusts this workflow
  # and the `pypi` environment; no token is stored.
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/copyengine/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
